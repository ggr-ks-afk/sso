<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サインイン | ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#1b2433;--sub:#5a6577;--line:#d3d9e4;--accent:#0e6f7a;--accent-ink:#fff;--warn:#b3261e;--ok:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--surface:#18202e;--ink:#e8edf6;--sub:#9aa6ba;--line:#2c3649;--accent:#4cc3d0;--accent-ink:#0a1a1d;--warn:#ff8a80;--ok:#6fd6a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--surface:#18202e;--ink:#e8edf6;--sub:#9aa6ba;--line:#2c3649;--accent:#4cc3d0;--accent-ink:#0a1a1d;--warn:#ff8a80;--ok:#6fd6a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7;min-height:100vh}
main{max-width:920px;margin:0 auto;padding:40px 20px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.02em}
p{margin:0}.sub{color:var(--sub);font-size:.92rem}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-weight:700}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.9rem}
.flow{display:flex;align-items:center;margin:0 0 28px;padding:0;list-style:none;overflow-x:auto}
.flow li{display:flex;align-items:center;font-size:.82rem;color:var(--sub);white-space:nowrap}
.flow li span{padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);transition:.25s}
.flow li+li::before{content:"";width:28px;height:2px;background:var(--line);transition:.25s}
.flow li.on span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flow li.on::before{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:440px}
.field{margin-top:18px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pw{position:relative}.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:.82rem;padding:6px 8px;border-radius:6px}
button{font:inherit;cursor:pointer}
.primary{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.primary:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.6em;margin-top:10px;font-size:.88rem}
.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--sub)}
.hint code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:.95em}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ghost{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.app{display:block;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none}
.app:hover{border-color:var(--accent)}
.app b{display:block;margin:8px 0 2px}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff}
.sess{font-size:.85rem;color:var(--sub);margin-top:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.erow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.erow input[type=text]{flex:1 1 150px;width:auto}.erow input[type=color]{width:44px;height:40px;padding:2px;flex:none}
.erow .u{flex:2 1 220px}
.erow button:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;vertical-align:middle}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="mark" aria-hidden="true">S</div><span id="org">社内ポータル</span></div>
  <ol class="flow" id="flow" aria-label="サインインの流れ">
    <li class="on"><span>入力</span></li>
    <li><span>認証サーバーで確認</span></li>
    <li><span>ポータルに戻る</span></li>
  </ol>

  <section id="login">
    <form class="card" id="form" novalidate>
      <h1>サインイン</h1>
      <p class="sub">ユーザー名とパスワードを入力してください。</p>
      <div class="field">
        <label for="user">ユーザー名</label>
        <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="pass">パスワード</label>
        <div class="pw">
          <input id="pass" name="password" type="password" autocomplete="current-password">
          <button type="button" id="toggle" aria-controls="pass">表示</button>
        </div>
      </div>
      <button class="primary" id="go" type="submit">サインイン</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="hint" id="hint"></div>
    </form>
  </section>

  <section id="home" hidden>
    <div class="head">
      <div><h1 id="hello"></h1><p class="sub">ログインしたまま、すべてのアプリを開けます。</p></div>
      <div class="bar"><button class="ghost" id="edit" hidden>タイルを編集</button><button class="ghost" id="out">サインアウト</button></div>
    </div>
    <div class="apps" id="apps"></div>
    <div class="msg" id="tmsg" role="status" aria-live="polite"></div>
    <p class="sess" id="sess"></p>
  </section>

  <section id="admin" hidden>
    <div class="head">
      <div><h1>タイルの編集<span class="badge">管理者</span></h1><p class="sub">ユーザーのホーム画面に表示されるタイルを変更します。</p></div>
      <div class="bar"><button class="ghost" id="add">＋ タイルを追加</button></div>
    </div>
    <div id="rows"></div>
    <div class="bar" style="margin-top:14px"><button class="primary" id="save" style="width:auto;margin:0;padding:10px 22px">保存</button><button class="ghost" id="cancel">キャンセル</button></div>
    <div class="msg" id="emsg" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
(function(){
  /* ===== 設定：本番ではここだけ書き換える ===== */
  var CONFIG={
    orgName:"社内ポータル",
    helpText:"サインインできない場合は、情報システム担当にお問い合わせください。",
    demoMode:false,                                   /* false にするとSupabaseで実際に認証・保存する */
    supabaseUrl:"https://evyoevvtxndcfwafvlaf.supabase.co",
    supabaseKey:"sb_publishable_91iAFeJUjlrO2mW4zpT1Eg_CiXK8mbZ",                     /* anonキーのみ。service_roleは絶対に入れない */
    usernameDomain:"sso.intra.f5.si",              /* ユーザー名 → ユーザー名@このドメイン に変換 */
    demoAccount:{user:"demo",pass:"demo1234"},       /* デモ専用 */
    adminAccount:{user:"admin",pass:"admin1234"}     /* デモ専用 */
  };
  var DEMO_TILES=[
    {label:"勤怠管理",sub:"打刻・休暇申請",color:"#2b6cb0",url:"#"},
    {label:"経費精算",sub:"申請・承認",color:"#b7791f",url:"#"},
    {label:"社内Wiki",sub:"ナレッジ検索",color:"#2f855a",url:"#"},
    {label:"人事システム",sub:"給与明細・各種手続き",color:"#9b2c6b",url:"#"}
  ];
  /* ============================================ */
  var $=function(i){return document.getElementById(i)};
  var steps=document.querySelectorAll("#flow li");
  var fails=0,tiles=[],draft=[];
  var sb=(!CONFIG.demoMode&&window.supabase)?window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey):null;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  var clone=function(t){return Object.assign({},t)};
  var isAdminUser=function(u){return !!u&&(u.app_metadata||{}).app_role==="admin"};
  var safeUrl=function(u){return /^(https?:\/\/\S+|#)$/.test(u||"")?u:"#"};
  function h(tag,a,kids){var e=document.createElement(tag);for(var k in a){if(k==="text")e.textContent=a[k];else if(k==="class")e.className=a[k];else e[k]=a[k]}(kids||[]).forEach(function(x){e.appendChild(x)});return e}
  function setStep(n){steps.forEach(function(li,i){li.classList.toggle("on",i<=n)})}
  function say(id,t,c){var m=$(id);m.textContent=t;m.className="msg "+(c||"")}

  $("org").textContent=CONFIG.orgName;
  document.title=CONFIG.orgName+" | サインイン";
  if(CONFIG.demoMode){
    $("hint").innerHTML="デモ用アカウント：<code>"+CONFIG.demoAccount.user+"</code>／<code>"+CONFIG.demoAccount.pass+"</code>（一般）、<code>"+CONFIG.adminAccount.user+"</code>／<code>"+CONFIG.adminAccount.pass+"</code>（管理者）";
  }else{$("hint").textContent=CONFIG.helpText}

  /* ---- 認証 ---- */
  async function check(u,p){
    if(CONFIG.demoMode){
      await wait(700);
      if(u===CONFIG.adminAccount.user&&p===CONFIG.adminAccount.pass)return {ok:true,name:u,admin:true};
      if(u===CONFIG.demoAccount.user&&p===CONFIG.demoAccount.pass)return {ok:true,name:u,admin:false};
      return {ok:false};
    }
    var em=u.indexOf("@")>0?u:u+"@"+CONFIG.usernameDomain;
    var r=await sb.auth.signInWithPassword({email:em,password:p});
    if(r.error){if([400,401,422].indexOf(r.error.status)>=0)return {ok:false};throw r.error}
    return {ok:true,name:u,admin:isAdminUser(r.data.user)};
  }
  async function signIn(e){
    e.preventDefault();
    var u=$("user").value.trim(),p=$("pass").value;
    if(!u||!p){say("msg","ユーザー名とパスワードを両方入力してください。","err");return}
    $("go").disabled=true;$("user").readOnly=$("pass").readOnly=true;
    setStep(1);say("msg","認証サーバーで確認しています…");
    var r;
    try{r=await check(u,p)}catch(err){r=null;setStep(0);say("msg","認証サーバーに接続できません。時間をおいて再度お試しください。","err")}
    if(r&&r.ok){setStep(2);say("msg","サインインしました。","ok");await wait(400);fails=0;show(r.name,r.admin);return}
    if(r){
      fails++;setStep(0);$("pass").value="";
      if(fails>=5){say("msg","失敗が続いたため、15秒間入力できません。","err");await wait(15000);fails=0;say("msg","")}
      else say("msg","ユーザー名またはパスワードが正しくありません。","err");
    }
    $("go").disabled=false;$("user").readOnly=$("pass").readOnly=false;$("pass").focus();
  }

  /* ---- タイル表示 ---- */
  async function loadTiles(){
    say("tmsg","");
    if(!sb){if(!tiles.length)tiles=DEMO_TILES.map(clone);renderTiles();return}
    var r=await sb.from("tiles").select("*").order("sort");
    if(r.error){say("tmsg","タイルを読み込めませんでした。","err");tiles=[]}else tiles=r.data;
    renderTiles();
  }
  function renderTiles(){
    var box=$("apps");box.textContent="";
    tiles.forEach(function(t){
      var url=safeUrl(t.url),ext=url.charAt(0)!=="#";
      var a=h("a",{class:"app",href:url});
      if(ext){a.target="_blank";a.rel="noopener noreferrer"}
      var dot=h("div",{class:"dot",text:(t.label||"?").charAt(0)});dot.style.background=/^#[0-9a-fA-F]{6}$/.test(t.color)?t.color:"#2b6cb0";
      a.appendChild(dot);a.appendChild(h("b",{text:t.label}));a.appendChild(h("span",{class:"sub",text:t.sub||""}));
      box.appendChild(a);
    });
  }

  /* ---- 管理者：タイル編集 ---- */
  function openEditor(){draft=tiles.map(clone);$("home").hidden=true;$("admin").hidden=false;say("emsg","");drawEditor()}
  function closeEditor(){$("admin").hidden=true;$("home").hidden=false;renderTiles()}
  function drawEditor(){
    var box=$("rows");box.textContent="";
    draft.forEach(function(t,i){
      function txt(key,ph,max,label,cls){var x=h("input",{type:"text",placeholder:ph,maxLength:max,value:t[key]||"",class:cls||""});x.setAttribute("aria-label",label);x.addEventListener("input",function(){t[key]=x.value});return x}
      var col=h("input",{type:"color",value:/^#[0-9a-fA-F]{6}$/.test(t.color)?t.color:"#2b6cb0"});col.setAttribute("aria-label","色");col.addEventListener("input",function(){t.color=col.value});
      function btn(text,label,fn,dis){var b=h("button",{type:"button",class:"ghost",text:text,disabled:!!dis});b.setAttribute("aria-label",label);b.addEventListener("click",fn);return b}
      function mv(d){return function(){var j=i+d,x=draft[i];draft[i]=draft[j];draft[j]=x;drawEditor()}}
      box.appendChild(h("div",{class:"erow"},[col,txt("label","名前",40,"名前"),txt("sub","説明",80,"説明"),txt("url","https://…",300,"リンク先URL","u"),
        btn("↑","上へ",mv(-1),i===0),btn("↓","下へ",mv(1),i===draft.length-1),
        btn("削除","削除",function(){draft.splice(i,1);drawEditor()})]));
    });
    if(!draft.length)box.appendChild(h("p",{class:"sub",text:"タイルがありません。「＋ タイルを追加」から作成してください。"}));
  }
  async function save(){
    for(var i=0;i<draft.length;i++){
      var t=draft[i];t.label=(t.label||"").trim();t.url=(t.url||"").trim();t.sub=(t.sub||"").trim();
      if(!t.label){say("emsg","タイル"+(i+1)+"：名前を入力してください。","err");return}
      if(!/^(https?:\/\/\S+|#)$/.test(t.url)){say("emsg","タイル"+(i+1)+"：URLは https:// で始めるか、# にしてください。","err");return}
    }
    $("save").disabled=true;say("emsg","保存しています…");
    try{
      if(sb){
        var keep=draft.filter(function(t){return t.id}).map(function(t){return t.id});
        var del=tiles.filter(function(t){return keep.indexOf(t.id)<0}).map(function(t){return t.id});
        if(del.length){var d=await sb.from("tiles").delete().in("id",del);if(d.error)throw d.error}
        var rows=draft.map(function(t,i){var o={label:t.label,sub:t.sub,color:t.color,url:t.url,sort:i};if(t.id)o.id=t.id;return o});
        var up=rows.filter(function(o){return o.id}),nw=rows.filter(function(o){return !o.id});
        if(up.length){var u=await sb.from("tiles").upsert(up);if(u.error)throw u.error}
        if(nw.length){var n=await sb.from("tiles").insert(nw);if(n.error)throw n.error}
        await loadTiles();
      }else{tiles=draft.map(clone)}
      closeEditor();
    }catch(err){say("emsg","保存できませんでした。管理者権限の設定（付与後は再ログインが必要）とRLSを確認してください。","err")}
    $("save").disabled=false;
  }

  /* ---- 画面遷移 ---- */
  function show(name,admin){
    $("login").hidden=true;$("home").hidden=false;$("admin").hidden=true;
    $("hello").textContent=name+" さん、こんにちは";
    $("edit").hidden=!admin;
    $("sess").textContent="サインイン方法：ユーザー名とパスワード／権限："+(admin?"管理者":"一般");
    $("go").disabled=false;$("user").readOnly=$("pass").readOnly=false;
    loadTiles();
  }
  function signOut(){
    if(sb)sb.auth.signOut();
    $("home").hidden=true;$("admin").hidden=true;$("login").hidden=false;
    $("user").value=$("pass").value="";say("msg","");setStep(0);$("user").focus();
  }
  $("form").addEventListener("submit",signIn);
  $("out").addEventListener("click",signOut);
  $("edit").addEventListener("click",openEditor);
  $("cancel").addEventListener("click",closeEditor);
  $("add").addEventListener("click",function(){draft.push({label:"",sub:"",color:"#2b6cb0",url:"https://"});drawEditor()});
  $("save").addEventListener("click",save);
  $("toggle").addEventListener("click",function(){
    var sh=$("pass").type==="password";
    $("pass").type=sh?"text":"password";this.textContent=sh?"隠す":"表示";
  });
  if(sb){sb.auth.getSession().then(function(d){var s=d.data&&d.data.session;if(s)show((s.user.email||"").split("@")[0],isAdminUser(s.user))})}
})();
</script>
</body>
</html>
